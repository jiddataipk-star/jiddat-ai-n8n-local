# Portable single-folder n8n. Everything that matters lives next to this file:
#   .env   -> settings + N8N_ENCRYPTION_KEY (never commit)
#   data/  -> SQLite DB, settings, binary data, workflow files (never commit)
# Copy this whole folder to another PC/VPS and `docker compose up -d`. See README.md.
name: n8n

services:
  n8n:
    # Pinned. To upgrade, change the tag (see README "Upgrade"). Never use :latest.
    image: n8nio/n8n:2.44.7
    container_name: n8n
    restart: unless-stopped
    ports:
      # Localhost only. On a VPS, a reverse proxy (HTTPS) sits in front of this.
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    env_file: .env
    environment:
      # Refuse to start without a key, otherwise n8n would silently invent one.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env - see README}
      N8N_PORT: "5678"
      # Default '::' crash-loops on hosts with IPv6 disabled (common on VPSes).
      N8N_LISTEN_ADDRESS: "0.0.0.0"
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./data/files:/home/node/.n8n-files
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
